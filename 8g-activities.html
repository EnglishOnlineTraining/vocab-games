<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Year 8 Gymnasium — docemus | EnglishOnline.training</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a3a5c;
  --blue-mid:#1a6eb5;
  --blue-lt:#e8f2fb;
  --gold:#c9a227;
  --gold-lt:#f5e6b0;
  --teal:#2b7a78;
  --green:#27ae60;
  --red:#c0392b;
  --dark:#1d2b3a;
  --mid:#4a5568;
  --muted:#6b7a8d;
  --border:#dce3ec;
  --bg:#f0f8ff;
  --white:#fff;
  --radius:12px;
  --shadow:0 2px 16px rgba(26,58,92,.1);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;padding-bottom:4rem}
.site-header{background:var(--blue);color:#fff;padding:2rem 1rem 1.75rem;text-align:center}
.site-header .logo{font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem;display:block}
.site-header h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin-bottom:.4rem}
.site-header p{color:rgba(255,255,255,.75);font-size:.95rem}
.header-divider{height:4px;background:linear-gradient(90deg,var(--gold),var(--teal))}
.breadcrumb{background:var(--white);border-bottom:1px solid var(--border);padding:.75rem 1rem;margin-bottom:1rem}
.breadcrumb a{color:var(--blue-mid);text-decoration:none;font-size:.9rem}
.breadcrumb a:hover{text-decoration:underline}
.container{max-width:860px;margin:0 auto;padding:2rem 1rem}
.page-title{font-size:1.4rem;font-weight:800;color:var(--blue);margin-bottom:.5rem}
.page-subtitle{font-size:.95rem;color:var(--muted);margin-bottom:1.5rem}
.coming-soon{text-align:center;padding:3rem 1rem;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1.5px solid var(--border)}
.coming-soon-icon{font-size:3rem;margin-bottom:1rem}
.coming-soon-title{font-size:1.3rem;font-weight:700;color:var(--blue);margin-bottom:.5rem}
.coming-soon-text{color:var(--muted);font-size:.95rem}
.site-footer{text-align:center;font-size:.8rem;color:var(--muted);margin-top:3rem}
.site-footer a{color:var(--blue-mid)}
</style>
</head>
<body>

<header class="site-header">
  <span class="logo">docemus · EnglishOnline.training</span>
  <h1>📚 Year 8 Gymnasium</h1>
  <p>Coming soon</p>
</header>
<div class="header-divider"></div>

<nav class="breadcrumb">
  <a href="activities.html">← Back to Activities</a>
</nav>

<main class="container">

  <h2 class="page-title">Year 8 Gymnasium</h2>
  <p class="page-subtitle">Exercises coming soon</p>

  <div class="coming-soon">
    <div class="coming-soon-icon">🚀</div>
    <h3 class="coming-soon-title">Coming Soon</h3>
    <p class="coming-soon-text">Exercises for Year 8 Gymnasium are currently in development. Check back soon!</p>
  </div>

</main>

<footer class="site-footer">
  <a href="https://englishonline.training">EnglishOnline.training</a> · docemus activities
</footer>

</body>
</html>
