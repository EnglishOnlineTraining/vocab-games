name: Social media posts

# Publishes the posts in _social/posts/ whose time has come (scripts/social-post.js), then
# commits _social/posted.json so the next run doesn't send them again. Approving a post =
# merging the PR that adds its file. _social/ starts with "_" so GitHub Pages (Jekyll) never
# serves it, though the repo itself is public.
on:
  schedule:
    - cron: '7,37 * * * *'   # GitHub may start scheduled runs late; posts go out within ~30–60 min
  workflow_dispatch: {}

permissions:
  contents: write

# Never two runs at once: both would see the same post as unsent and post it twice.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # ADMIN_PAT for the same reason as rebuild-indices.yml: main's ruleset blocks GITHUB_TOKEN pushes.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.ADMIN_PAT || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Publish due posts
        id: publish
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/social-post.js

      # always(): a run where one network failed still records the ones that went out.
      # ponytail: if this push fails after a post went out, the next run posts it again. Rare
      # (the job holds the concurrency lock); the upgrade is a retry loop with git pull --rebase.
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "eol-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _social/posted.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record social posts sent [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
