name: Check generated files

# The PR gate. rebuild-indices.yml fixes main after the fact; this stops a pull
# request landing with stale generated output or an invalid build graph in the
# first place.
#
# Note this cannot run on the rebuild bot's own push: GitHub does not trigger
# workflows from pushes made with GITHUB_TOKEN (and that commit also carries
# [skip ci]). That is fine — the bot's output is by definition freshly built.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pre-publish gate diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails on a fake edge or a missing write-after-write barrier.
      - name: Validate the build graph
        run: node scripts/build.js --explain

      # Rebuilds, then fails if anything committed differs from what the
      # generators produce — including a stale docs/build-graph.mmd.
      - name: Check generated files are up to date
        run: node scripts/build.js --check

      # The pre-publish gate: a page this PR ADDS gets the per-page checks the
      # drafting skills run by hand (verify-exercise.js — TOTAL_STEPS, scoreKey,
      # UNIT, state.scores, leftover TODOs, and the webhook its prefix routes to).
      # Abitur packs get the subset that applies to their template (TODOs, UNIT,
      # the Abitur webhook, the public teacher email).
      # Added pages only: many legacy pages predate these conventions.
      - name: Verify exercise pages added by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          fail=0
          for f in $(git diff --name-only --diff-filter=A "origin/$BASE...HEAD" -- '*.html'); do
            case "$f" in */*|_*) continue ;; esac
            # Framework pages, plus Abitur packs (own template, WEBHOOK_URL).
            grep -q -e 'exercise\.js' -e 'var WEBHOOK_URL' "$f" || continue
            node scripts/verify-exercise.js "$f" || fail=1
          done
          exit $fail
