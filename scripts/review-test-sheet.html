<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marking sheet</title>
<!--
  Generated by scripts/review-test.js. Never edit a generated sheet — edit this
  template and rerun.

  This file HOLDS STUDENT NAMES AND ANSWERS once it is filled in. It must not be
  committed to the repo and must not be published. Marks live in this browser's
  localStorage only; "Copy TSV" is how they leave.
-->
<style>
:root{--blue:#1a3a5c;--gold:#c9a227;--teal:#2b7a78;--red:#c0392b;--green:#27ae60;
--bg:#f7f9fc;--card:#fff;--text:#1d2b3a;--muted:#6b7a8d;--border:#dce3ec;--radius:12px;
--font:'Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#131a22;--card:#1b2430;--text:#e8eef6;
--muted:#9fb0c4;--border:#2c3a4a}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:1rem}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:.6rem 1rem}
header b{font-size:1rem}
.bar{height:6px;background:rgba(255,255,255,.25);margin-top:.45rem;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;
background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:4}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--blue);
background:var(--blue);color:#fff;padding:.45rem .9rem}
button.alt{background:transparent;color:var(--text);border-color:var(--border)}
.stu{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
margin:.9rem 0;overflow:hidden}
.stu h2{margin:0;padding:.6rem .9rem;background:rgba(26,58,92,.06);font-size:.95rem;
display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}
.res{font-weight:400;font-size:.85rem;color:var(--muted);white-space:nowrap}
.flag{font-size:.72rem;background:var(--gold);color:#3a2d00;border-radius:99px;padding:.1rem .5rem;margin-left:.4rem}
.q{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .9rem;border-top:1px solid var(--border);flex-wrap:wrap}
.q.done{background:rgba(39,174,96,.07)}
.w{font-weight:600;color:var(--teal);min-width:11rem;flex:0 0 11rem}
.s{flex:1 1 22rem;min-width:14rem}
.btns{display:flex;gap:.3rem;margin-left:auto}
button.m{min-width:2.4rem;padding:.3rem .5rem;background:transparent;color:var(--text);border-color:var(--border)}
button.m.on{background:var(--green);border-color:var(--green);color:#fff}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--card)}
th,td{border:1px solid var(--border);padding:.35rem .5rem;text-align:left}
th{background:rgba(26,58,92,.08)}
.hint{color:var(--muted);font-size:.84rem}
@media (max-width:560px){.w{flex:1 1 100%}.btns{margin-left:0}}
</style>
</head>
<body>
<header>
  <b id="hd">Marking sheet</b>
  <div class="bar"><i id="pi"></i></div>
  <div style="font-size:.8rem;margin-top:.3rem" id="pt">0 / 0</div>
</header>
<div class="tools">
  <span class="hint">Keys: <b>1</b> = full, <b>2</b> = half, <b>3</b> = zero. It moves on by itself.</span>
  <button onclick="showResults()">Show results</button>
  <button class="alt" onclick="copyTSV()">Copy TSV</button>
  <button class="alt" onclick="if(confirm('Clear all marks?')){localStorage.removeItem(KEY);location.reload()}">Reset</button>
  <span id="msg" class="hint"></span>
</div>
<div class="wrap" id="list"></div>
<div class="wrap" id="out"></div>
<script>
var DATA = /*DATA*/;
var S=DATA.students, PER=DATA.pointsEach, BTN=DATA.buttons, TMAX=DATA.teacherMax, AMAX=DATA.autoMax;
var TOTAL=AMAX+TMAX, N=S.length?S[0].items.length:0, ALL=S.length*N;
var KEY='eol-marking-'+DATA.unit;
var marks={};try{marks=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
document.getElementById('hd').textContent=DATA.unit+' — teacher-marked section ('+PER+' points per answer)';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function grade(t){var i=Math.round(t*2);var r=DATA.grades[i]||DATA.grades[DATA.grades.length-1];return r?[r[1],r[2]]:[0,'']}
function cTotal(n){var s=0;for(var i=0;i<N;i++){var v=marks[n+'|'+i];if(v!=null)s+=v}return s}
function done(n){var d=0;for(var i=0;i<N;i++)if(marks[n+'|'+i]!=null)d++;return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(marks))}catch(e){}}
function render(){
  var h='';
  S.forEach(function(s,si){
    h+='<div class="stu"><h2><span>'+(si+1)+'. '+esc(s.display||s.name)+
       (s.flags&&s.flags.length?' <span class="flag">'+s.flags.map(esc).join('</span> <span class="flag">')+'</span>':'')+
       '</span><span class="res" id="r-'+si+'"></span></h2>';
    s.items.forEach(function(it,qi){
      h+='<div class="q" id="q-'+si+'-'+qi+'"><span class="w">'+esc(it.prompt)+'</span>'+
         '<span class="s">'+esc(it.given||'(nothing written)')+'</span><span class="btns">'+
         BTN.map(function(v){return '<button class="m" data-v="'+v+'" onclick="mark('+si+','+qi+','+v+')">'+v+'</button>'}).join('')+
         '</span></div>';
    });
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h;
  S.forEach(function(s,si){s.items.forEach(function(it,qi){paint(si,qi)});upd(si)});
  prog();
}
function paint(si,qi){
  var n=S[si].name,v=marks[n+'|'+qi],el=document.getElementById('q-'+si+'-'+qi);
  el.className='q'+(v!=null?' done':'');
  [].forEach.call(el.querySelectorAll('button.m'),function(b){
    b.className='m'+(v!=null&&parseFloat(b.getAttribute('data-v'))===v?' on':'')});
}
function upd(si){
  var s=S[si],c=cTotal(s.name),t=s.auto+c,g=grade(t);
  document.getElementById('r-'+si).textContent=
    'auto '+s.auto+'  +  marked '+c+'/'+TMAX+'  =  '+t+'/'+TOTAL+'   Note '+g[0]+' ('+g[1]+')'+
    (done(s.name)<N?'  ['+done(s.name)+'/'+N+' marked]':'');
}
function prog(){
  var d=0;S.forEach(function(s){d+=done(s.name)});
  document.getElementById('pi').style.width=(ALL?100*d/ALL:0)+'%';
  document.getElementById('pt').textContent=d+' / '+ALL;
}
var cur=[0,0];
function mark(si,qi,v){
  marks[S[si].name+'|'+qi]=v;save();paint(si,qi);upd(si);prog();
  var nx=qi<N-1?[si,qi+1]:(si<S.length-1?[si+1,0]:null);
  if(nx){cur=nx;var e=document.getElementById('q-'+nx[0]+'-'+nx[1]);
    e.scrollIntoView({block:'center',behavior:'smooth'});e.style.outline='2px solid var(--gold)';
    setTimeout(function(){e.style.outline=''},700)}
}
document.addEventListener('keydown',function(e){
  var i={'1':0,'2':1,'3':2}[e.key];
  if(i===undefined)return;e.preventDefault();mark(cur[0],cur[1],BTN[i]);
});
function rows(){return S.map(function(s){var c=cTotal(s.name),t=s.auto+c,g=grade(t);
  return [s.name,s.auto,c,t,'Note '+g[0]+' ('+g[1]+')']})}
function showResults(){
  var r=rows(),h='<h2>Results</h2><table><tr><th>#</th><th>Student</th><th>Auto</th><th>Marked /'+TMAX+
    '</th><th>Total /'+TOTAL+'</th><th>Note</th></tr>';
  r.forEach(function(x,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(S[i].display||x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+
    '</td><td><b>'+x[3]+'</b></td><td>'+x[4]+'</td></tr>'});
  h+='</table>';
  var d={};r.forEach(function(x){d[x[4]]=(d[x[4]]||0)+1});
  h+='<p><b>Spread:</b> '+Object.keys(d).sort().map(function(k){return k+' × '+d[k]}).join(' · ')+'</p>';
  h+='<p><b>Class average:</b> '+(r.reduce(function(s,x){return s+x[3]},0)/(r.length||1)).toFixed(1)+' / '+TOTAL+'</p>';
  var o=document.getElementById('out');o.innerHTML=h;o.scrollIntoView({behavior:'smooth'});
}
function copyTSV(){
  var t='Student\tAuto\tMarked\tTotal\tNote\n'+rows().map(function(x){return x.join('\t')}).join('\n');
  var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');document.getElementById('msg').textContent='Copied '+rows().length+' rows.'}
  catch(e){document.getElementById('msg').textContent='Copy failed — select the table instead.'}
  ta.remove();
}
render();
</script>
</body>
</html>
