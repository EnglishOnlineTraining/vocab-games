<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Landmarks | englishonline.training</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #1a3a5c;
      --gold:    #c9a227;
      --gold-lt: #f5e6b0;
      --teal:    #2b7a78;
      --red:     #c0392b;
      --green:   #27ae60;
      --bg:      #f7f9fc;
      --card:    #ffffff;
      --text:    #1d2b3a;
      --muted:   #6b7a8d;
      --border:  #dce3ec;
      --radius:  12px;
      --shadow:  0 2px 16px rgba(26,58,92,.1);
      --font:    'Segoe UI', system-ui, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }

    /* ── Header ── */
    .app-header { background: var(--blue); color: #fff; padding: 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1.25rem; gap: 1rem; }
    .header-logo { font-size: .8rem; font-weight: 700; color: var(--gold); text-decoration: none; white-space: nowrap; }
    .header-meta { font-size: .78rem; text-align: right; opacity: .9; }
    .header-meta strong { display: block; color: var(--gold); }
    .progress-track { height: 6px; background: rgba(255,255,255,.2); }
    .progress-fill { height: 100%; background: var(--gold); transition: width .4s ease; width: 0%; }

    /* ── Steps ── */
    .step { display: none; }
    .step.active { display: block; }
    .step-inner { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 2rem; }

    /* ── Exercise labels ── */
    .ex-badge { display: inline-block; background: var(--gold); color: var(--blue); font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: .25rem .7rem; border-radius: 6px; margin-bottom: 1rem; }
    .ex-title { font-size: 1.5rem; font-weight: 700; color: var(--blue); margin-bottom: .4rem; }
    .ex-subtitle { font-size: .9rem; color: var(--muted); margin-bottom: 1.5rem; }

    /* ── Cards ── */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1.25rem; }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--blue); margin-bottom: .75rem; }

    /* ── Reading text ── */
    .reading-text { font-size: .93rem; line-height: 1.85; color: var(--text); }
    .reading-text p { margin-bottom: .85rem; }
    .reading-text p:last-child { margin-bottom: 0; }
    .reading-text strong { color: var(--blue); }

    /* ── Forms ── */
    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-size: .85rem; font-weight: 600; color: var(--blue); margin-bottom: .4rem; }
    .form-input, .form-textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: .65rem .85rem; font-family: var(--font); font-size: .92rem;
      color: var(--text); background: #fff; transition: border-color .2s;
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--blue); }
    .form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    .form-hint { font-size: .78rem; color: var(--muted); margin-top: .3rem; }

    /* ── Gap-fill (dropdown) ── */
    .gap-text { font-size: .93rem; line-height: 2.6; color: var(--text); }
    .gap-select {
      display: inline-block; border: 1.5px solid var(--gold); border-radius: 6px;
      padding: .18rem .45rem; font-family: var(--font); font-size: .82rem;
      background: var(--gold-lt); color: var(--blue); cursor: pointer;
      vertical-align: middle; margin: 0 2px; max-width: 200px;
    }
    .gap-select:focus { outline: none; border-color: var(--blue); }
    .gap-correct { background: #d4edda !important; border-color: var(--green) !important; color: #155724 !important; }
    .gap-wrong   { background: #fde8e8 !important; border-color: var(--red) !important;   color: #721c24 !important; }
    .gap-num { font-size: .68rem; color: var(--muted); vertical-align: super; margin-right: 1px; }

    /* ── Word bank ── */
    .word-bank { background: var(--gold-lt); border: 1.5px solid var(--gold); border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1.25rem; }
    .word-bank strong { display: block; color: var(--blue); margin-bottom: .5rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
    .word-bank span { display: inline-block; margin: .2rem .3rem; background: var(--blue); color: #fff; border-radius: 4px; padding: .18rem .55rem; font-size: .8rem; font-weight: 600; }

    /* ── Comprehension questions ── */
    .comp-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: .85rem; background: #fafbfc; }
    .comp-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--blue); font-size: .75rem; font-weight: 700; }
    .comp-question { font-size: .9rem; font-weight: 600; color: var(--blue); margin-bottom: .5rem; }

    /* ── Feedback banners ── */
    .feedback { padding: .8rem 1rem; border-radius: 8px; font-size: .88rem; font-weight: 500; margin-top: 1rem; display: none; }
    .feedback.show { display: block; }
    .feedback.ok   { background: #d4edda; color: #155724; }
    .feedback.warn { background: #fff3cd; color: #856404; }
    .feedback.err  { background: #fde8e8; color: #721c24; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .75rem 1.5rem; border-radius: 8px; font-family: var(--font); font-size: .9rem; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(26,58,92,.3); }
    .btn-primary:hover { background: #15304f; }
    .btn-gold { background: var(--gold); color: var(--blue); box-shadow: 0 2px 8px rgba(201,162,39,.3); }
    .btn-gold:hover { background: #b8911f; }
    .btn-outline { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
    .btn-outline:hover { background: var(--blue); color: #fff; }
    .btn-sm { padding: .5rem 1rem; font-size: .82rem; }
    .btn-block { width: 100%; justify-content: center; margin-top: 1.25rem; }
    .btn-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.25rem; }

    /* ── Welcome screen ── */
    .welcome-hero { text-align: center; padding: 2.5rem 1rem 2rem; }
    .welcome-flag { font-size: 3rem; margin-bottom: 1rem; }
    .welcome-title { font-size: 1.8rem; font-weight: 700; color: var(--blue); margin-bottom: .5rem; }
    .welcome-sub { font-size: 1rem; color: var(--muted); margin-bottom: 2rem; max-width: 440px; margin-left: auto; margin-right: auto; }
    .exercise-overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem; margin-bottom: 2rem; }
    .ov-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: .85rem 1rem; font-size: .82rem; }
    .ov-card strong { display: block; color: var(--blue); margin-bottom: .2rem; font-size: .88rem; }
    .ov-card.locked { opacity: .5; }
    .ov-icon { font-size: 1.1rem; margin-bottom: .3rem; }

    /* ── Submit / summary ── */
    .submit-summary { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1.5rem; }
    .summary-row { border-bottom: 1px solid var(--border); padding: .75rem 0; font-size: .875rem; }
    .summary-row:last-child { border-bottom: none; }
    .summary-ex { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); margin-bottom: .2rem; }
    .summary-q  { font-weight: 600; color: var(--blue); margin-bottom: .3rem; }
    .summary-a  { color: var(--text); white-space: pre-wrap; }

    @media (max-width: 480px) {
      .ex-title { font-size: 1.25rem; }
      .btn { padding: .65rem 1.1rem; }
      .welcome-title { font-size: 1.4rem; }
      .gap-select { max-width: 150px; font-size: .75rem; }
    }
  </style>
</head>
<body>

<!-- ── Sticky header ── -->
<header class="app-header">
  <div class="header-inner">
    <a class="header-logo" href="https://englishonline.training">englishonline.training</a>
    <a class="header-logo" href="7g-activities.html" style="font-size:.75rem;opacity:.8">&larr; Activities</a>
    <div class="header-meta" id="header-meta" style="display:none">
      <strong id="header-name"></strong>
      <span id="header-step">Exercise A of 4</span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</header>
<script>
var UNIT          = '7g-london-landmarks';
var TOTAL_STEPS   = 4;
var SHEET_URL     = 'https://hook.eu1.make.com/1gx46wea33yguetah95oy4j8asbyafqm';
var TEACHER_EMAIL = 'shaun.trezise@docemus.de';
var currentStep   = 0;

var state = {
  name:  '',
  cls:   '',
  ex1:   {},
  ex2:   {},
  ex3:   {},
  ex4:   {}
};

function showStep(n) {
  document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('step-' + n).classList.add('active');
  document.getElementById('progress-fill').style.width = Math.round(n / TOTAL_STEPS * 100) + '%';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  currentStep = n;
  restoreStep(n);
  var meta = document.getElementById('header-meta');
  if (n === 0) { meta.style.display = 'none'; return; }
  meta.style.display = 'block';
  document.getElementById('header-name').textContent = state.name + (state.cls ? ' — ' + state.cls : '');
  var labels = ['A', 'B', 'C', 'D'];
  document.getElementById('header-step').textContent = n < TOTAL_STEPS
    ? 'Exercise ' + labels[n - 1] + ' of 4'
    : 'Submit';
}

function prevStep(n) { saveStep(n); clearErr(n); showStep(n - 1); }

function nextStep(n) {
  if (!validateStep(n)) {
    var err = document.getElementById('step' + n + '-error');
    if (err) { err.textContent = 'Please answer all required questions before continuing.'; err.classList.add('show'); }
    return;
  }
  clearErr(n);
  saveStep(n);
  if (n === TOTAL_STEPS - 1) { buildSummary(); }
  showStep(n + 1);
}

function clearErr(n) {
  var err = document.getElementById('step' + n + '-error');
  if (err) err.classList.remove('show');
}

function startExercises() {
  var name = g('inp-name'), cls = g('inp-class');
  var err = document.getElementById('welcome-error');
  if (!name || !cls) {
    err.textContent = 'Please enter both your name and your class.';
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');
  state.name = name;
  state.cls  = cls;
  showStep(1);
}

function validateStep(n) {
  switch (n) {
    case 1:
      return val('ex1-q1') && val('ex1-q2') && val('ex1-q3');
    case 2:
      return val('ex2-q1') && val('ex2-q2');
    case 3:
      var ids = ['g1','g2','g3','g4','g5','g6'];
      var answered = ids.filter(function(k) { return g('ex3-' + k) !== ''; }).length;
      return answered >= 5;
    case 4:
      return val('ex4-text') && g('ex4-text').length >= 40;
    default:
      return true;
  }
}

function saveStep(n) {
  switch (n) {
    case 1:
      state.ex1.q1 = g('ex1-q1');
      state.ex1.q2 = g('ex1-q2');
      state.ex1.q3 = g('ex1-q3');
      break;
    case 2:
      state.ex2.q1 = g('ex2-q1');
      state.ex2.q2 = g('ex2-q2');
      break;
    case 3:
      ['g1','g2','g3','g4','g5','g6'].forEach(function(k) {
        state.ex3[k] = g('ex3-' + k);
      });
      break;
    case 4:
      state.ex4.text = g('ex4-text');
      break;
  }
}

function restoreStep(n) {
  switch (n) {
    case 1:
      set('ex1-q1', state.ex1.q1);
      set('ex1-q2', state.ex1.q2);
      set('ex1-q3', state.ex1.q3);
      break;
    case 2:
      set('ex2-q1', state.ex2.q1);
      set('ex2-q2', state.ex2.q2);
      break;
    case 3:
      ['g1','g2','g3','g4','g5','g6'].forEach(function(k) {
        set('ex3-' + k, state.ex3[k]);
      });
      break;
    case 4:
      set('ex4-text', state.ex4.text);
      break;
  }
}

function g(id)      { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function set(id, v) { var el = document.getElementById(id); if (el && v !== undefined) el.value = v; }
function val(id)    { return g(id).length > 0; }
function esc(str)   { var d = document.createElement('div'); d.textContent = String(str == null ? '' : str); return d.innerHTML; }

function buildSummary() {
  var rows = [
    { ex: 'Exercise A', q: 'Q1', a: state.ex1.q1 },
    { ex: 'Exercise A', q: 'Q2', a: state.ex1.q2 },
    { ex: 'Exercise A', q: 'Q3', a: state.ex1.q3 },
    { ex: 'Exercise B', q: 'Q1', a: state.ex2.q1 },
    { ex: 'Exercise B', q: 'Q2', a: state.ex2.q2 },
    { ex: 'Exercise C', q: 'Gap-fill', a: ['g1','g2','g3','g4','g5','g6'].map(function(k,i){ return (i+1) + '. ' + (state.ex3[k] || '(blank)'); }).join('\n') },
    { ex: 'Exercise D', q: 'Writing', a: state.ex4.text }
  ];
  var html = '<div class="submit-summary"><div class="summary-row"><div class="summary-ex">Student</div><div class="summary-q">' + esc(state.name) + ' — ' + esc(state.cls) + '</div></div>';
  rows.forEach(function(r) {
    html += '<div class="summary-row"><div class="summary-ex">' + esc(r.ex) + '</div><div class="summary-q">' + esc(r.q) + '</div><div class="summary-a">' + esc(r.a || '(no answer)') + '</div></div>';
  });
  html += '</div>';
  document.getElementById('summary-container').innerHTML = html;
}

function submitToSheet() {
  saveStep(currentStep);
  buildSummary();
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  var payload = { name: state.name, cls: state.cls, unit: UNIT };
  Object.keys(state).forEach(function(key) {
    if (key !== 'name' && key !== 'cls') {
      var val = state[key];
      if (typeof val === 'object' && val !== null) {
        Object.keys(val).forEach(function(k) { payload[key + '-' + k] = val[k] || ''; });
      } else {
        payload[key] = val || '';
      }
    }
  });
  fetch(SHEET_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    btn.style.display = 'none';
    document.getElementById('submit-success').style.display = 'block';
    document.getElementById('submit-fallback').style.display = 'block';
  }).catch(function() {
    btn.disabled = false;
    btn.textContent = 'Submit to Teacher';
    document.getElementById('submit-fallback').style.display = 'block';
  });
}

document.addEventListener('DOMContentLoaded', function() { showStep(0); });
</script>
<p>London Landmarks exercise file. Full exercise content would go here with exercise steps and submission.</p>
</body>
</html>
