<html lang="en">
<head>

<title>My Progress | EnglishOnline.training</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1a3a5c;
  --blue-mid:#1a6eb5;
  --blue-lt:#e8f2fb;
  --gold:#c9a227;
  --gold-lt:#f5e6b0;
  --teal:#2b7a78;
  --green:#27ae60;
  --red:#c0392b;
  --dark:#1d2b3a;
  --mid:#4a5568;
  --muted:#6b7a8d;
  --border:#dce3ec;
  --bg:#f0f8ff;
  --card:#ffffff;
  --brand-title:#1a3a5c;
  --hero-from:#12314f;
  --hero-to:#1a3a5c;
  --radius:14px;
  --shadow:0 2px 16px rgba(26,58,92,.1);
  --shadow-hover:0 6px 24px rgba(26,110,181,.20);
  --gap:clamp(.7rem,2vw,1rem);
  --pad-block:clamp(1.6rem,5vw,2.75rem);
}

@media (prefers-color-scheme:dark){
  :root{
    --blue-lt:#14324c;
    --dark:#e7eef6;
    --mid:#b3c0cf;
    --muted:#8a99aa;
    --border:#28394d;
    --bg:#0e1620;
    --card:#16212e;
    --brand-title:#cfe0f4;
    --blue-mid:#5aa8f0;
    --hero-from:#0b1c30;
    --hero-to:#122a41;
    --shadow:0 2px 18px rgba(0,0,0,.45);
    --shadow-hover:0 6px 26px rgba(0,0,0,.6);
  }
}

html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.skip-link{
  position:absolute;left:.5rem;top:-3rem;z-index:100;
  background:var(--gold);color:#1a1a1a;font-weight:700;
  padding:.5rem 1rem;border-radius:8px;transition:top .2s;
}
.skip-link:focus{top:.5rem}

.site-header{
  position:relative;
  background:linear-gradient(160deg,var(--hero-from),var(--hero-to));
  color:#fff;
  padding:clamp(1.5rem,4vw,2.5rem) 1rem;
  text-align:center;
  overflow:hidden;
}
.site-header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--gold),var(--teal));
}
.site-header .logo{
  font-size:.8rem;font-weight:700;color:var(--gold-lt);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem;display:block;
  text-decoration:none;
}
.site-header h1{
  font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;
  line-height:1.15;letter-spacing:-.01em;
}
.site-header .tagline{
  color:rgba(255,255,255,.82);font-size:clamp(.85rem,2vw,1rem);
  max-width:30rem;margin:.4rem auto 0;
}
.header-nav{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem 1.2rem;
  margin-top:.8rem;
}
.header-nav a{
  color:var(--gold-lt);font-size:.82rem;font-weight:600;text-decoration:none;
  opacity:.85;transition:opacity .15s;
}
.header-nav a:hover{opacity:1;text-decoration:underline}

.wrap{max-width:960px;margin:0 auto;padding:var(--pad-block) 1rem}

/* Stats row */
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:var(--gap);margin-bottom:clamp(1.5rem,4vw,2.25rem);
}
.stat-card{
  background:var(--card);border-radius:var(--radius);padding:1.1rem;
  text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);
}
.stat-icon{font-size:1.6rem;margin-bottom:.2rem}
.stat-value{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;color:var(--blue-mid)}
.stat-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:.1rem}

/* Two-column layout */
.columns{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(1rem,3vw,1.5rem);align-items:start}
@media(max-width:700px){.columns{grid-template-columns:1fr}}

.panel{
  background:var(--card);border-radius:var(--radius);padding:clamp(1rem,3vw,1.4rem);
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:var(--gap);
}
.panel h2{font-size:1rem;font-weight:700;color:var(--brand-title);margin-bottom:1rem}
.panel h3{font-size:.9rem;font-weight:700;color:var(--brand-title);margin-bottom:.7rem}

/* Progress bars */
.prog-item{margin-bottom:1rem}
.prog-head{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.25rem}
.prog-title{font-weight:600}
.prog-pct{font-weight:700;color:var(--blue-mid)}
.prog-track{background:var(--border);border-radius:6px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:6px;transition:width .4s ease}
.prog-meta{font-size:.7rem;color:var(--muted);margin-top:.2rem}

/* Resume card */
.resume{
  background:linear-gradient(135deg,var(--hero-from),var(--hero-to));
  color:#fff;border:none;
}
.resume h3{color:#fff !important}
.resume p{font-size:.85rem;opacity:.88;margin:.4rem 0 .8rem}
.resume a{
  display:inline-block;background:var(--gold);color:var(--blue);
  padding:.45rem 1rem;border-radius:8px;text-decoration:none;
  font-weight:700;font-size:.82rem;
}
.resume a:hover{filter:brightness(1.08)}

/* Recent list */
.recent-list{list-style:none}
.recent-list li{padding:.55rem 0;border-bottom:1px solid var(--border)}
.recent-list li:last-child{border-bottom:none}
.recent-title{display:block;font-size:.85rem;font-weight:600}
.recent-meta{font-size:.72rem;color:var(--muted)}

/* Empty state */
.empty-state{
  text-align:center;padding:clamp(2rem,8vw,4rem) 1rem;
  color:var(--muted);
}
.empty-state h2{font-size:1.3rem;color:var(--brand-title);margin-bottom:.5rem}
.empty-state p{font-size:.9rem;max-width:28rem;margin:0 auto .8rem}
.empty-state a{
  display:inline-block;background:var(--blue);color:#fff;
  padding:.5rem 1.3rem;border-radius:8px;text-decoration:none;
  font-weight:700;font-size:.85rem;margin-top:.3rem;
}
.empty-state a:hover{filter:brightness(1.15)}

/* Export */
.export-section{margin-top:.8rem}
.export-btn{
  width:100%;padding:.55rem;background:var(--blue);color:#fff;
  border:none;border-radius:8px;font-weight:700;font-size:.82rem;
  cursor:pointer;font-family:inherit;
}
.export-btn:hover{filter:brightness(1.15)}
.export-result{
  margin-top:.5rem;padding:.5rem;font-size:.72rem;
  background:var(--blue-lt);border-radius:6px;color:var(--dark);
  word-break:break-all;display:none;
}

/* Footer */
.site-footer{text-align:center;font-size:.8rem;color:var(--muted);margin-top:clamp(2rem,5vw,3rem);padding:0 1rem 2rem}
.site-footer a{color:var(--blue-mid)}
.site-footer-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem 1.1rem;margin-bottom:.7rem}
.site-footer-nav a{font-weight:600;text-decoration:none}
.site-footer-nav a:hover{text-decoration:underline}
</style>

<script>
(function() {
  var container = document.getElementById('dashboard-content');

  var CATEGORY_LABELS = {
    '7-gymnasium':    'Year 7 Gymnasium',
    '7-oberschule':   'Year 7 Oberschule',
    '8-gymnasium':    'Year 8 Gymnasium',
    '8-oberschule':   'Year 8 Oberschule',
    '9-gymnasium':    'Year 9 Gymnasium',
    '9-oberschule':   'Year 9 Oberschule',
    '10-gymnasium':   'Year 10 Gymnasium',
    '10-oberschule':  'Year 10 Oberschule',
    'abitur-gymnasium':'Abitur',
    'msa-oberschule': 'MSA',
    'uni-university': 'University',
    'business-business':'Business English',
    'it-vocational':  'IT English',
    'grammar-grammar':'Grammar Quizzes',
    'quiz-quiz':      'Quizzes'
  };

  var CATEGORY_ORDER = [
    '7-gymnasium','7-oberschule','8-gymnasium','8-oberschule',
    '9-gymnasium','9-oberschule','10-gymnasium','10-oberschule',
    'abitur-gymnasium','msa-oberschule',
    'uni-university','business-business','it-vocational',
    'grammar-grammar','quiz-quiz'
  ];

  function unitFromFile(f) { return f.replace(/\.html$/, ''); }

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem('eol_progress') || '{}'); } catch(e) { return {}; }
  }
  function loadStreak() {
    try { return JSON.parse(localStorage.getItem('eol_streak') || '{"count":0,"lastDate":""}'); } catch(e) { return {count:0,lastDate:''}; }
  }

  function catKey(ex) { return ex.year + '-' + ex.schoolType; }

  function render(exercises) {
    var progress = loadProgress();
    var streak = loadStreak();

    var completedUnits = {};
    var startedUnits = {};
    Object.keys(progress).forEach(function(u) {
      if (progress[u].completed) completedUnits[u] = progress[u];
      else if (progress[u].started) startedUnits[u] = progress[u];
    });

    var completedCount = Object.keys(completedUnits).length;

    if (completedCount === 0 && Object.keys(startedUnits).length === 0) {
      container.innerHTML = '<div class="empty-state">'
        + '<h2>No progress yet</h2>'
        + '<p>Complete an exercise to start tracking your progress, streaks, and scores.</p>'
        + '<a href="activities.html">Browse Exercises</a>'
        + '</div>';
      return;
    }

    var catCounts = {};
    var catCompleted = {};
    exercises.forEach(function(ex) {
      var ck = catKey(ex);
      catCounts[ck] = (catCounts[ck] || 0) + 1;
      var unit = unitFromFile(ex.file);
      if (completedUnits[unit]) catCompleted[ck] = (catCompleted[ck] || 0) + 1;
    });

    var startedCats = CATEGORY_ORDER.filter(function(ck) { return catCompleted[ck] || false; });

    // Stats row
    var html = '<section class="stats-row">'
      + '<div class="stat-card"><div class="stat-icon">&#x1F525;</div>'
      + '<div class="stat-value">' + streak.count + '</div>'
      + '<div class="stat-label">Day Streak</div></div>'
      + '<div class="stat-card"><div class="stat-icon">&#x2705;</div>'
      + '<div class="stat-value">' + completedCount + '</div>'
      + '<div class="stat-label">Exercises Done</div></div>'
      + '<div class="stat-card"><div class="stat-icon">&#x1F4CA;</div>'
      + '<div class="stat-value">' + startedCats.length + '/' + CATEGORY_ORDER.filter(function(ck){return catCounts[ck];}).length + '</div>'
      + '<div class="stat-label">Categories Started</div></div>'
      + '<div class="stat-card"><div class="stat-icon">&#x1F3AF;</div>'
      + '<div class="stat-value">' + exercises.length + '</div>'
      + '<div class="stat-label">Total Available</div></div>'
      + '</section>';

    // Two columns
    html += '<div class="columns"><div>';

    // Category progress bars
    html += '<div class="panel"><h2>Progress by Category</h2>';
    CATEGORY_ORDER.forEach(function(ck) {
      if (!catCounts[ck]) return;
      var done = catCompleted[ck] || 0;
      var total = catCounts[ck];
      var pct = Math.round((done / total) * 100);
      var label = CATEGORY_LABELS[ck] || ck;
      html += '<div class="prog-item">'
        + '<div class="prog-head"><span class="prog-title">' + label + '</span><span class="prog-pct">' + pct + '%</span></div>'
        + '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>'
        + '<div class="prog-meta">' + done + ' of ' + total + ' exercises</div>'
        + '</div>';
    });
    html += '</div></div>';

    // Sidebar
    html += '<div>';

    // Resume card — most recent started-but-not-completed
    var resumeEntries = Object.keys(startedUnits).map(function(u) {
      return { unit: u, date: startedUnits[u].date || '' };
    }).sort(function(a, b) { return b.date > a.date ? 1 : -1; });

    if (resumeEntries.length > 0) {
      var resumeUnit = resumeEntries[0].unit;
      var resumeEx = null;
      exercises.forEach(function(ex) { if (unitFromFile(ex.file) === resumeUnit) resumeEx = ex; });
      if (resumeEx) {
        html += '<div class="panel resume"><h3>Continue Where You Left Off</h3>'
          + '<p>' + esc(resumeEx.title) + '</p>'
          + '<a href="' + resumeEx.file + '?mode=practise">Resume &rarr;</a>'
          + '</div>';
      }
    }

    // Recent activity
    html += '<div class="panel"><h3>Recent Activity</h3><ul class="recent-list">';
    var recent = Object.keys(completedUnits).map(function(u) {
      return { unit: u, data: completedUnits[u] };
    }).sort(function(a, b) { return b.data.date > a.data.date ? 1 : -1; }).slice(0, 10);

    if (recent.length === 0) {
      html += '<li style="color:var(--muted);text-align:center;padding:1rem 0">No completed exercises yet.</li>';
    } else {
      recent.forEach(function(r) {
        var ex = null;
        exercises.forEach(function(e) { if (unitFromFile(e.file) === r.unit) ex = e; });
        var title = ex ? ex.title : r.unit;
        var cat = ex ? (CATEGORY_LABELS[catKey(ex)] || '') : '';
        var date = r.data.date ? new Date(r.data.date).toLocaleDateString() : '';
        var score = (r.data.score !== undefined && r.data.total) ? r.data.score + '/' + r.data.total : '';
        html += '<li><span class="recent-title">' + esc(title) + '</span>'
          + '<span class="recent-meta">' + cat + (date ? ' &middot; ' + date : '') + (score ? ' &middot; ' + score : '') + '</span></li>';
      });
    }
    html += '</ul></div>';

    // Export section
    html += '<div class="panel export-section"><h3>Export Progress</h3>'
      + '<p style="font-size:.78rem;color:var(--muted);margin-bottom:.6rem">Copy your progress data to share with your teacher.</p>'
      + '<button class="export-btn" id="export-btn">Copy Progress to Clipboard</button>'
      + '<div class="export-result" id="export-result"></div>'
      + '</div>';

    html += '</div></div>'; // close sidebar + columns

    container.innerHTML = html;

    // Export handler
    var exportBtn = document.getElementById('export-btn');
    if (exportBtn) {
      exportBtn.addEventListener('click', function() {
        var lines = ['Progress Report — EnglishOnline.training', 'Exported: ' + new Date().toLocaleString(), ''];
        lines.push('Streak: ' + streak.count + ' days');
        lines.push('Completed: ' + completedCount + ' exercises');
        lines.push('');
        recent.forEach(function(r) {
          var ex = null;
          exercises.forEach(function(e) { if (unitFromFile(e.file) === r.unit) ex = e; });
          var title = ex ? ex.title : r.unit;
          var score = (r.data.score !== undefined && r.data.total) ? ' — ' + r.data.score + '/' + r.data.total : '';
          var date = r.data.date ? new Date(r.data.date).toLocaleDateString() : '';
          lines.push('- ' + title + score + (date ? ' (' + date + ')' : ''));
        });
        var text = lines.join('\n');
        navigator.clipboard.writeText(text).then(function() {
          var el = document.getElementById('export-result');
          el.textContent = 'Copied to clipboard!';
          el.style.display = 'block';
          setTimeout(function() { el.style.display = 'none'; }, 3000);
        }).catch(function() {
          prompt('Copy this text:', text);
        });
      });
    }
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  // Load exercises.json and render
  fetch('data/exercises.json')
    .then(function(res) { return res.json(); })
    .then(render)
    .catch(function(err) {
      console.error('Failed to load exercises.json', err);
      container.innerHTML = '<div class="empty-state">'
        + '<h2>Could not load exercise data</h2>'
        + '<p>Please try again later or <a href="activities.html">browse exercises</a> instead.</p>'
        + '</div>';
    });
})();
</script>
